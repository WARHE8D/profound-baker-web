# Checks formatting, lint, types, tests and the production build on every push and pull request,
# and runs the end-to-end tests against the real backend.
# Must pass before merging.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch or PR supersedes the running build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # src/api/schema.d.ts must match the committed spec snapshot (openapi/openapi.json).
      # Refresh both with `npm run api:types` against a running backend.
      - name: API types are up to date
        run: npm run api:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The backend, built from its main branch: the SPA is tested against the API it will meet.
      - name: Checkout the server
        uses: actions/checkout@v7
        with:
          repository: WARHE8D/profound-baker-server
          path: profound-baker-server

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The server's e2e stack: production's compose file with this commit's image behind its Caddyfile,
      # one origin. No backups here, so the bakery starts empty: no production data in CI.
      - name: Start the e2e stack
        run: npm run e2e:stack
        env:
          SERVER_DIR: profound-baker-server

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e:production

      - name: Backend logs
        if: failure()
        run: npm run e2e:stack:logs -- db-restore uploads-restore app web caddy
        env:
          SERVER_DIR: profound-baker-server

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
